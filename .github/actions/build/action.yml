name: 'Build'
description: 'Installs Wails (+ dependencies), builds and caches'

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
    - uses: actions/cache@v5
      with:
        path: frontend/node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
    - shell: bash
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev
    - uses: actions/cache@v5
      with:
        path: frontend/wailsjs
        key: ${{ runner.os }}-wailsjs-${{ hashFiles('app/**') }}
    - uses: actions/cache@v5
      with:
        path: frontend/auto-imports.d.ts
        key: ${{ runner.os }}-imports-${{ hashFiles('frontend/src/**') }}
    - uses: actions/cache@v5
      with:
        path: build/bin
        key: ${{ runner.os }}-build-${{ hashFiles('app/**', 'frontend/src/**') }}

    - shell: bash
      if: runner.os == 'Linux'
      run: |
        go tool wails build -tags webkit2_41
    - shell: pwsh
      if: runner.os == 'Windows'
      run: |
        go tool wails build
    - shell: bash
      if: runner.os == 'macOS'
      run: |
        go tool wails build -platform darwin/universal
